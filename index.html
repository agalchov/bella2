<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f0a22">
  <meta name="description" content="Обичам те, Мише.">
  <title>Обичам те, Мише ❤</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@500;600&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      color-scheme: dark;
      --night: #1f0a22;
      --wine: #4f1236;
      --rose: #a32a55;
      --coral: #e0654f;
      --dawn: #ffc27a;
      --paper: #fff7ef;
      --paper-shade: #f8e3d6;
      --ink: #4f1330;
      --crimson: #a3123f;
      --gold: #bd8a3e;
      --on-sky: #fff3e8;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--night); }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 34% at 50% 100%, #ffd79acc, transparent 72%),
        linear-gradient(180deg, var(--night) 0%, var(--wine) 40%, var(--rose) 74%, var(--coral) 100%);
      background-attachment: fixed;
      font-family: 'Cormorant Infant', Georgia, 'Times New Roman', serif;
    }
    ::selection { background: #f4c5d5; color: #4f1330; }

    .sky, .bloom {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sky { z-index: 0; }
    .bloom { z-index: 3; }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      min-height: 100svh;
      padding: 32px 16px;
    }
    .stage > * { grid-area: 1 / 1; }

    /* Sealed envelope */
    .envelope-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: min(440px, 100%);
      transition: opacity 500ms ease 620ms, transform 700ms var(--ease-out) 620ms;
    }
    .envelope {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      perspective: 1200px;
      filter: drop-shadow(0 24px 40px #14031a99);
      transition: transform 240ms var(--ease-out);
    }
    .envelope:hover { transform: translateY(-4px) rotate(-1deg); }
    .envelope:active { transform: scale(0.98); }
    .envelope:focus-visible { outline: 3px solid var(--dawn); outline-offset: 8px; }
    .envelope-back, .envelope-pocket, .envelope-flap { position: absolute; inset: 0; border-radius: 10px; }
    .envelope-back { background: var(--paper-shade); }
    .envelope-pocket {
      background: linear-gradient(160deg, var(--paper), var(--paper-shade));
      clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    }
    .envelope-flap {
      z-index: 1;
      background: linear-gradient(180deg, #f9e2d5, #eebfae);
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      transform-origin: top center;
      transition: transform 620ms cubic-bezier(0.45, 0, 0.3, 1);
    }
    .envelope-name {
      position: absolute;
      right: 0;
      bottom: 7%;
      left: 0;
      color: var(--crimson);
      font-family: 'Great Vibes', 'Cormorant Infant', cursive;
      font-size: clamp(32px, 10vw, 44px);
      line-height: 1.1;
      text-align: center;
    }
    .seal {
      position: absolute;
      z-index: 2;
      top: 60%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: -46px 0 0 -34px;
      border-radius: 47% 53% 50% 50% / 52% 48% 54% 46%;
      background: radial-gradient(circle at 35% 30%, #d8345f, #8f0f38 70%);
      box-shadow: 0 4px 10px #4f133066, inset 0 0 0 5px #7d0c30, inset 0 0 0 6px #d8345f99;
      transition: transform 280ms ease, opacity 280ms ease;
      animation: seal-beat 2.6s ease-in-out infinite;
    }
    .seal svg { width: 28px; height: 28px; fill: #ffd9e0; }
    .hint, .tap-hint {
      margin: 0;
      padding: 6px 18px;
      border-radius: 999px;
      background: #1f0a22a6;
      color: var(--on-sky);
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    /* The letter, arched like a window opening onto the dawn */
    .letter {
      position: relative;
      width: min(640px, 100%);
      padding: clamp(88px, 15vw, 112px) clamp(30px, 8vw, 72px) clamp(44px, 8vw, 60px);
      border-radius: 320px 320px 28px 28px;
      background: linear-gradient(180deg, var(--paper), #fff1e6);
      box-shadow: 0 30px 70px #14031a8c;
      text-align: center;
      outline: none;
    }
    .letter::before {
      content: '';
      position: absolute;
      inset: 11px;
      border: 1px solid #bd8a3e80;
      border-radius: 310px 310px 20px 20px;
      pointer-events: none;
    }
    .letter-heart {
      position: absolute;
      top: clamp(40px, 7vw, 54px);
      left: 50%;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      fill: var(--crimson);
    }
    .farewell {
      margin: 0;
      color: var(--crimson);
      font-family: 'Great Vibes', 'Cormorant Infant', cursive;
      font-weight: 400;
      line-height: 1.15;
      text-wrap: balance;
    }
    .message-part {
      margin: 22px 0 0;
      font-size: clamp(22px, 5.4vw, 26px);
      font-weight: 500;
      line-height: 1.5;
      text-wrap: pretty;
    }
    .divider {
      display: block;
      width: 150px;
      height: 16px;
      margin: 30px auto 24px;
      fill: none;
      stroke: var(--gold);
    }
    .divider path:last-child { fill: var(--gold); stroke: none; }
    .farewell { font-size: clamp(42px, 11vw, 60px); }
    .tap-hint { margin-top: 24px; }
    .letter-wrap { width: min(640px, 100%); display: flex; flex-direction: column; align-items: center; }

    /* Opening sequence: only when scripts can run, so the message never stays locked away */
    .js body:not(.is-open) .letter-wrap { visibility: hidden; }
    .js .letter-wrap { opacity: 0; transform: translateY(70px) scale(0.92); }
    .js body.is-open .letter-wrap {
      opacity: 1;
      transform: none;
      transition: opacity 700ms ease 760ms, transform 1100ms var(--ease-out) 760ms;
    }
    .js .reveal { opacity: 0; transform: translateY(14px); }
    .js body.is-open .reveal {
      opacity: 1;
      transform: none;
      transition: opacity 800ms ease, transform 800ms var(--ease-out);
      transition-delay: calc(1250ms + var(--step) * 420ms);
    }
    body.is-open .seal { opacity: 0; transform: scale(1.4); animation: none; }
    body.is-open .envelope-flap { transform: rotateX(180deg); }
    body.is-open .envelope-wrap { opacity: 0; transform: translateY(90px) scale(0.94); pointer-events: none; }

    @keyframes seal-beat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.07); }
      24% { transform: scale(1); }
      36% { transform: scale(1.05); }
      48% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="envelope-wrap" id="envelope-wrap">
      <button class="envelope" id="envelope" type="button" aria-label="Отвори писмото за Мишето">
        <span class="envelope-back"></span>
        <span class="envelope-pocket"></span>
        <span class="envelope-name">За Мишето</span>
        <span class="envelope-flap"></span>
        <span class="seal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8.5-5.2-8.5-11.4A4.9 4.9 0 0 1 12 6.6a4.9 4.9 0 0 1 8.500 3C20.500 15.800 12 21 12 21z"/></svg></span>
      </button>
      <p class="hint">Докосни, за да отвориш</p>
    </div>

    <div class="letter-wrap">
      <article class="letter" id="letter" aria-label="Писмо за Мишето" tabindex="-1">
        <svg class="letter-heart reveal" style="--step: 0" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8.500-5.200-8.500-11.400A4.900 4.900 0 0 1 12 6.600a4.900 4.900 0 0 1 8.500 3C20.500 15.800 12 21 12 21z"/></svg>
        <p class="message-part reveal" style="--step: 1">Всяка сутрин се събуждам с мисълта за теб и това ме кара да се усмихвам през целия ден.</p>
        <p class="message-part reveal" style="--step: 2">А вечер заспивам с желанието да си до мен — и с надеждата да те срещна поне в съня си.</p>
        <svg class="divider reveal" style="--step: 3" viewBox="0 0 150 16" aria-hidden="true"><path d="M0 8h62M88 8h62"/><path d="M75 15s-7-4.300-7-9.200A3.700 3.700 0 0 1 75 4a3.700 3.700 0 0 1 7 1.800C82 10.700 75 15 75 15z"/></svg>
        <h1 class="farewell reveal" style="--step: 3">Обичам те, Мише!</h1>
      </article>
      <p class="tap-hint reveal" id="tap-hint" style="--step: 4" hidden>Докосни екрана за още сърца</p>
    </div>
  </main>

  <canvas class="bloom" id="bloom" aria-hidden="true"></canvas>

  <script>
    (() => {
      // Send visit notifications only from the published site, not local previews.
      const publishedHosts = ['love.mihaela-bella.love', 'agalchov.github.io'];
      if (window.location.protocol !== 'https:' || !publishedHosts.includes(window.location.hostname)) return;

      const webhookUrl = 'https://hook.eu1.make.com/kb18e5xlos01f63ynwfyus48sba5nxul';
      const sessionKey = 'bella2.visit-notified';

      function notifyVisit() {
        // A background tab counts as a visit when the visitor first opens it.
        if (document.visibilityState !== 'visible') return;
        document.removeEventListener('visibilitychange', notifyVisit);

        try {
          if (window.sessionStorage.getItem(sessionKey)) return;
          window.sessionStorage.setItem(sessionKey, '1');
        } catch {
          // Notifications still work when session storage is unavailable.
        }

        const visit = new URLSearchParams({
          event: 'site_visit',
          page_url: window.location.origin + window.location.pathname,
          visited_at: new Date().toISOString()
        });

        // Form data avoids a CORS preflight; Make's response need not be read.
        fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          keepalive: true,
          body: visit
        }).catch(() => {
          // A failed request can be tried again on the next page load.
          try { window.sessionStorage.removeItem(sessionKey); } catch {}
        });
      }

      if (document.visibilityState === 'visible') notifyVisit();
      else document.addEventListener('visibilitychange', notifyVisit);
    })();
  </script>

  <script>
    (() => {
      const skyCanvas = document.getElementById('sky');
      const bloomCanvas = document.getElementById('bloom');
      const sky = skyCanvas.getContext('2d');
      const bloom = bloomCanvas.getContext('2d');
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const petalColors = ['#ff9ab8', '#ffb3c9', '#f0577f', '#ffc2d4'];
      const heartColors = ['#ff4d7d', '#ff7aa2', '#ffd0dc', '#ffc27a'];
      let width = 0, height = 0, stars = [], petals = [], hearts = [];

      const random = (min, max) => min + Math.random() * (max - min);

      function newPetal(anywhere) {
        const size = random(6, 13);
        return {
          x: random(0, width),
          y: anywhere ? random(0, height) : -20,
          size,
          speed: size * 2.6 + random(6, 18),
          sway: random(14, 38),
          phase: random(0, Math.PI * 2),
          spin: random(-1, 1),
          color: petalColors[Math.floor(random(0, petalColors.length))],
          isHeart: Math.random() < 0.3
        };
      }

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        for (const [canvas, context] of [[skyCanvas, sky], [bloomCanvas, bloom]]) {
          canvas.width = width * ratio;
          canvas.height = height * ratio;
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
        }
        stars = Array.from({ length: Math.round(width * height / 14000) }, () => ({
          x: random(0, width),
          y: random(0, height * 0.5),
          size: random(0.5, 1.6),
          phase: random(0, Math.PI * 2)
        }));
        petals = Array.from({ length: Math.min(44, Math.round(width * height / 24000)) }, () => newPetal(true));
      }

      function drawHeart(context, x, y, size, angle) {
        context.save();
        context.translate(x, y);
        context.rotate(angle);
        context.scale(size / 16, size / 16);
        context.beginPath();
        context.moveTo(0, 6);
        context.bezierCurveTo(-11, -2, -7, -11, 0, -5);
        context.bezierCurveTo(7, -11, 11, -2, 0, 6);
        context.fill();
        context.restore();
      }

      function drawSky(seconds, step) {
        sky.clearRect(0, 0, width, height);
        sky.fillStyle = '#fff3e8';
        for (const star of stars) {
          // Stars fade as they near the horizon, where the dawn is brighter.
          const fade = 1 - star.y / (height * 0.5);
          sky.globalAlpha = fade * (0.45 + 0.45 * Math.sin(seconds * 1.3 + star.phase));
          sky.fillRect(star.x, star.y, star.size, star.size);
        }
        for (const petal of petals) {
          petal.y += petal.speed * step;
          if (petal.y > height + 20) Object.assign(petal, newPetal(false));
          const x = petal.x + Math.sin(seconds * 0.8 + petal.phase) * petal.sway;
          const angle = seconds * petal.spin + petal.phase;
          sky.globalAlpha = 0.72;
          sky.fillStyle = petal.color;
          if (petal.isHeart) {
            drawHeart(sky, x, petal.y, petal.size * 1.5, Math.sin(angle) * 0.5);
          } else {
            sky.beginPath();
            sky.ellipse(x, petal.y, petal.size, petal.size * 0.55, angle, 0, Math.PI * 2);
            sky.fill();
          }
          sky.fillStyle = '#fff3e8';
        }
        sky.globalAlpha = 1;
      }

      function drawBloom(step) {
        bloom.clearRect(0, 0, width, height);
        hearts = hearts.filter((heart) => heart.life > 0);
        for (const heart of hearts) {
          heart.life -= step / heart.duration;
          heart.velocityY -= 26 * step;
          heart.x += heart.velocityX * step;
          heart.y += heart.velocityY * step;
          bloom.globalAlpha = Math.min(1, heart.life * 2);
          bloom.fillStyle = heart.color;
          drawHeart(bloom, heart.x, heart.y, heart.size, heart.angle);
        }
        bloom.globalAlpha = 1;
      }

      function burst(x, y, count) {
        if (calm) return;
        for (let i = 0; i < count && hearts.length < 90; i += 1) {
          const direction = random(0, Math.PI * 2);
          const force = random(30, 150);
          hearts.push({
            x,
            y,
            velocityX: Math.cos(direction) * force,
            velocityY: Math.sin(direction) * force - 50,
            size: random(12, 30),
            angle: random(-0.4, 0.4),
            color: heartColors[i % heartColors.length],
            life: 1,
            duration: random(1.1, 2)
          });
        }
      }

      let previous = 0;
      function frame(now) {
        const step = Math.min((now - previous) / 1000, 0.05);
        previous = now;
        drawSky(now / 1000, step);
        drawBloom(step);
        window.requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', () => {
        resize();
        if (calm) drawSky(0, 0);
      });
      if (calm) drawSky(0, 0);
      else window.requestAnimationFrame(frame);

      const envelope = document.getElementById('envelope');
      const envelopeWrap = document.getElementById('envelope-wrap');
      const letter = document.getElementById('letter');
      const tapHint = document.getElementById('tap-hint');

      envelope.addEventListener('click', () => {
        document.body.classList.add('is-open');
        if (!calm) tapHint.hidden = false;
        letter.focus({ preventScroll: true });
        window.setTimeout(() => burst(width / 2, height / 2, 40), 500);
        // Removed afterwards so only the letter sets the page height.
        window.setTimeout(() => { envelopeWrap.hidden = true; }, calm ? 0 : 1400);
        document.addEventListener('pointerdown', (event) => burst(event.clientX, event.clientY, 14));
      }, { once: true });
    })();
  </script>
</body>
</html>
