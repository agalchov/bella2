<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0717">
  <meta name="description" content="Нарисувах ти небе, Мише.">
  <title>Небе за Мишето ✦</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Playfair+Display:ital,wght@1,400;1,500&amp;display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      color-scheme: dark;
      --night: #0a0717;
      --plum: #2a0f3a;
      --rose: #c2416f;
      --blush: #ff9fbf;
      --gold: #ffd59e;
      --text: #fbefe6;
      --muted: #d6c3d8;
      --glass: #ffffff0f;
      --glass-edge: #ffffff24;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--night); }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--text);
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #1a0b2e 0%, var(--night) 60%);
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: var(--blush); color: var(--night); }

    /* Slow aurora behind everything */
    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .aurora span {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(1) { top: -30vmax; left: -20vmax; background: radial-gradient(circle, #7b2a8a, transparent 65%); }
    .aurora span:nth-child(2) { top: 10vmax; right: -35vmax; background: radial-gradient(circle, var(--rose), transparent 65%); animation-duration: 22s; animation-delay: -6s; }
    .aurora span:nth-child(3) { bottom: -45vmax; left: -10vmax; background: radial-gradient(circle, #3b1f7a, transparent 65%); animation-duration: 26s; animation-delay: -12s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(6vmax, 4vmax) scale(1.12); }
    }
    .stars { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

    /* Three.js hearts and petals, between the aurora and the star dust */
    .hearts3d {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
      /* Keep the middle quiet so the words stay easy to read. */
      -webkit-mask-image: radial-gradient(ellipse 42% 46% at 50% 50%, #0004 30%, #000 100%);
      mask-image: radial-gradient(ellipse 42% 46% at 50% 50%, #0004 30%, #000 100%);
    }
    .hearts3d.ready { opacity: 1; }
    .js body.started .hearts3d.ready { opacity: 0.45; }
    .js body.started .hearts3d.bright { opacity: 1; }
    /* The mice who carry each gift run above everything, without catching taps. */
    .couriers { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
    /* During the finale they slip behind the letter so the words stay clear. */
    .couriers.behind { z-index: 1; }

    main {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      min-height: 100svh;
      padding: 32px 16px;
    }
    main > section { grid-area: 1 / 1; }

    /* Intro */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 560px;
      text-align: center;
      transition: opacity 600ms ease, transform 800ms var(--ease-out);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }
    .intro h1, .finale h2 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      line-height: 1.05;
      text-wrap: balance;
      background: linear-gradient(100deg, var(--text) 10%, var(--blush) 55%, var(--gold) 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .intro h1 { font-size: clamp(46px, 12vw, 84px); }
    .lead {
      margin: 22px 0 36px;
      max-width: 34ch;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
      text-wrap: pretty;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 28px;
      border: 1px solid #ffd59e66;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffd59e26, #ff9fbf1f);
      color: var(--text);
      font: 600 17px/1 'Manrope', system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 0 0 0 #ffd59e40, 0 10px 30px #0006;
      transition: transform 200ms var(--ease-out), box-shadow 300ms ease, background 300ms ease;
    }
    .btn svg { width: 18px; height: 18px; fill: var(--gold); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 6px #ffd59e1a, 0 14px 34px #0008; }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .star:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    /* Constellation */
    .sky {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: min(560px, 100%);
    }
    .sky-title {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }
    .sky-title strong { color: var(--gold); font-weight: 600; }
    .frame {
      position: relative;
      width: min(100%, 50svh, 480px);
      aspect-ratio: 1;
    }
    .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .link {
      stroke: var(--gold);
      stroke-width: 0.3;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0.75;
      filter: drop-shadow(0 0 1px #ffd59e);
      transition: stroke-dashoffset 900ms var(--ease-out);
    }
    .link.on { stroke-dashoffset: 0; }
    .heart-line {
      fill: url(#heart-fill);
      fill-opacity: 0;
      stroke: url(#heart-stroke);
      stroke-width: 0.55;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      filter: drop-shadow(0 0 2px #ff9fbf);
    }
    .complete .heart-line {
      fill-opacity: 1;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 2200ms cubic-bezier(0.65, 0, 0.35, 1) 300ms, fill-opacity 1600ms ease 2000ms;
    }
    .complete .heart-line { animation: heart-beat 2.4s ease-in-out 3.6s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes heart-beat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.04); }
      28% { transform: scale(1); }
      42% { transform: scale(1.03); }
    }

    .star {
      position: absolute;
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: -36px 0 0 -36px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }
    .star { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 16px #ffffffbb); transition: filter 600ms ease; }
    /* Soft halo that breathes behind each sparkle */
    .star::before {
      content: '';
      grid-area: 1 / 1;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff40, #ffffff00 70%);
      animation: halo 2.8s ease-in-out infinite;
      animation-delay: var(--delay);
      transition: background 600ms ease, width 600ms var(--ease-out), height 600ms var(--ease-out);
    }
    /* Four-pointed sparkle */
    .glint {
      grid-area: 1 / 1;
      width: 46px;
      height: 46px;
      background: radial-gradient(circle, #fff 0 22%, #fff6ea 34%, #ffe6c4 70%);
      clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
      animation: twinkle 2.8s ease-in-out infinite;
      animation-delay: var(--delay);
      transition: scale 500ms var(--ease-out), rotate 700ms var(--ease-out), background 500ms ease;
    }
    .star:hover .glint { scale: 1.35; rotate: 20deg; }
    .star.lit { cursor: default; filter: drop-shadow(0 0 4px #ffd59e) drop-shadow(0 0 14px #ff9fbfaa); }
    .star.lit .glint {
      background: radial-gradient(circle, #fff 0 18%, var(--gold) 40%, var(--blush) 85%);
      scale: 1.25;
      rotate: 45deg;
      animation: none;
    }
    .star.lit::before {
      width: 92px;
      height: 92px;
      background: radial-gradient(circle, #ff9fbf55, #ff9fbf00 70%);
    }
    /* While a gift is on its way, the star pulses in anticipation. */
    .star.waiting .glint { animation: waiting 0.7s ease-in-out infinite alternate; }
    @keyframes halo {
      0%, 100% { opacity: 0.6; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes waiting {
      to { scale: 1.3; rotate: 30deg; }
    }
    .star.lit::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--gold);
      animation: ripple 900ms var(--ease-out) forwards;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }
    @keyframes ripple {
      from { opacity: 0.9; transform: scale(0.3); }
      to { opacity: 0; transform: scale(1.6); }
    }

    .card {
      width: 100%;
      min-height: 132px;
      padding: 22px 26px;
      border: 1px solid var(--glass-edge);
      border-radius: 24px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      text-align: center;
    }
    .count {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
    }
    .note {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 5.6vw, 28px);
      font-style: italic;
      line-height: 1.35;
      text-wrap: balance;
    }
    .note.fresh { animation: rise 700ms var(--ease-out); }
    .sculpture {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      touch-action: pan-y;
      cursor: grab;
    }
    .sculpture:active { cursor: grabbing; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    .finale { display: flex; flex-direction: column; align-items: center; outline: none; }
    .finale h2 { font-size: clamp(40px, 10vw, 60px); padding: 0 0.1em 0.08em; }
    .finale p { margin: 10px 0 0; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .finale .wish { margin-top: 18px; color: var(--gold); font-size: 14px; font-weight: 600; letter-spacing: 0.08em; }

    /* Scene changes, only when scripts can run */
    .js .sky { opacity: 0; visibility: hidden; transform: translateY(24px); }
    .js body.started .intro { opacity: 0; transform: translateY(-24px) scale(0.98); pointer-events: none; }
    .js body.started .sky {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 900ms ease 400ms, transform 1000ms var(--ease-out) 400ms;
    }
    .finale.show { animation: rise 1200ms var(--ease-out) both; animation-delay: 2400ms; }

    noscript p { max-width: 30ch; font-size: 22px; line-height: 1.5; text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas class="hearts3d" id="hearts3d" aria-hidden="true"></canvas>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <main>
    <section class="intro" id="intro">
      <p class="eyebrow">За Мишето</p>
      <h1>Нарисувах ти небе.</h1>
      <p class="lead">Пет звезди. Запали ги една по една.</p>
      <button class="btn" id="start" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.6 5.7 21l2.3-7.2-6-4.6h7.6z"/></svg>
        Запали звездите
      </button>
      <noscript><p>Обичам те, Мише. Ти си най-красивото нещо в моето небе.</p></noscript>
    </section>

    <section class="sky" id="sky" aria-labelledby="sky-title">
      <p class="sky-title" id="sky-title">Докосни <strong>всяка звезда</strong></p>
      <div class="frame" id="frame">
        <canvas class="sculpture" id="sculpture" aria-hidden="true"></canvas>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="heart-stroke" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd59e"/>
              <stop offset="1" stop-color="#ff6f9c"/>
            </linearGradient>
            <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
              <stop offset="0" stop-color="#ffd59e"/>
              <stop offset="1" stop-color="#ff9fbf"/>
            </linearGradient>
            <linearGradient id="bloom" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd59e" stop-opacity="0.45"/>
              <stop offset="1" stop-color="#ff6f9c" stop-opacity="0.55"/>
            </linearGradient>
            <radialGradient id="heart-fill" cx="0.5" cy="0.45" r="0.6">
              <stop offset="0" stop-color="#ff6f9c" stop-opacity="0.38"/>
              <stop offset="1" stop-color="#c2416f" stop-opacity="0.04"/>
            </radialGradient>
          </defs>
          <g id="links"></g>
          <path class="heart-line" id="heart" pathLength="1"/>
        </svg>
      </div>
      <div class="card" id="card">
        <div id="progress" aria-live="polite">
          <p class="count" id="count">0 / 5</p>
          <p class="note" id="note">Всяка звезда пази нещо за теб.</p>
        </div>
        <div class="finale" id="finale" tabindex="-1" hidden>
          <h2>Обичам те, Мише.</h2>
          <p>Ти си най-красивото нещо в моето небе.</p>
        </div>
      </div>
    </section>
  </main>
  <canvas class="couriers" id="couriers" aria-hidden="true"></canvas>

  <script>
    (() => {
      // Send visit notifications only from the published site, not local previews.
      const publishedHosts = ['love.mihaela-bella.love', 'agalchov.github.io'];
      if (window.location.protocol !== 'https:' || !publishedHosts.includes(window.location.hostname)) return;

      const webhookUrl = 'https://hook.eu1.make.com/kb18e5xlos01f63ynwfyus48sba5nxul';
      const sessionKey = 'bella2.visit-notified';

      function notifyVisit() {
        // A background tab counts as a visit when the visitor first opens it.
        if (document.visibilityState !== 'visible') return;
        document.removeEventListener('visibilitychange', notifyVisit);

        try {
          if (window.sessionStorage.getItem(sessionKey)) return;
          window.sessionStorage.setItem(sessionKey, '1');
        } catch {
          // Notifications still work when session storage is unavailable.
        }

        const visit = new URLSearchParams({
          event: 'site_visit',
          page_url: window.location.origin + window.location.pathname,
          visited_at: new Date().toISOString()
        });

        // Form data avoids a CORS preflight; Make's response need not be read.
        fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          keepalive: true,
          body: visit
        }).catch(() => {
          // A failed request can be tried again on the next page load.
          try { window.sessionStorage.removeItem(sessionKey); } catch {}
        });
      }

      if (document.visibilityState === 'visible') notifyVisit();
      else document.addEventListener('visibilitychange', notifyVisit);
    })();
  </script>

  <script>
    (() => {
      // Each star awakens a living 3D sculpture made of light.
      const drawings = [
        { label: 'Въздушна целувка', shape: flyingKiss },
        { label: 'Прегръдка', shape: hug },
        { label: 'Любов', shape: love },
        { label: 'Безкрайност', shape: infinity },
        { label: 'Сърце', shape: pierced }
      ];
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const random = (min, max) => min + Math.random() * (max - min);

      // Classic heart curve, mapped into the 0–100 frame.
      function heartPoint(t) {
        const x = 16 * Math.sin(t) ** 3;
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return [50 + x * 2.75, 50 + (y - 2.5) * 2.75];
      }

      const frame = document.getElementById('frame');
      const links = document.getElementById('links');
      const heart = document.getElementById('heart');
      const count = document.getElementById('count');
      const note = document.getElementById('note');
      const progress = document.getElementById('progress');
      const finale = document.getElementById('finale');
      const sky = document.getElementById('sky');

      // Start at the bottom tip so five stars still trace a heart.
      const points = drawings.map((_, i) => heartPoint(Math.PI + (i / drawings.length) * Math.PI * 2));
      const lit = new Array(drawings.length).fill(false);
      const opened = new Array(drawings.length).fill(false);
      const lines = [];

      heart.setAttribute('d', Array.from({ length: 121 }, (_, i) => {
        const [x, y] = heartPoint((i / 120) * Math.PI * 2);
        return (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
      }).join('') + 'Z');

      points.forEach(([x, y], i) => {
        const [nx, ny] = points[(i + 1) % points.length];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'link');
        line.setAttribute('pathLength', '1');
        line.setAttribute('x1', x); line.setAttribute('y1', y);
        line.setAttribute('x2', nx); line.setAttribute('y2', ny);
        links.appendChild(line);
        lines.push(line);

        const star = document.createElement('button');
        star.type = 'button';
        star.className = 'star';
        star.innerHTML = '<span class="glint"></span>';
        star.style.left = x + '%';
        star.style.top = y + '%';
        star.style.setProperty('--delay', (-i * 0.35) + 's');
        star.setAttribute('aria-label', 'Звезда ' + (i + 1) + ' от ' + drawings.length);
        star.addEventListener('click', () => light(i, star));
        frame.appendChild(star);
      });

      // ---- Living 3D sculptures: thousands of glowing points ----
      const TAU = Math.PI * 2;
      const sculpture = document.getElementById('sculpture');
      const sctx = sculpture.getContext('2d');
      const COUNT = window.matchMedia('(max-width: 600px)').matches ? 2600 : 3800;
      const seeds = Float32Array.from({ length: COUNT * 4 }, Math.random);
      const shown = new Float32Array(COUNT * 5);
      const from = new Float32Array(COUNT * 5);
      const o = [0, 0, 0, 0, 1];
      let shape = nebula, morphAt = -Infinity, spin = 0, dragX = null;
      let viewRY = 0.35, viewRX = 0.18, dim = 1, dimTarget = 1, sway = 0.75;
      let sculptW = 0, sculptH = 0, hx = 0, hy = 0;

      function put(x, y, z, c, a) { o[0] = x; o[1] = y; o[2] = z; o[3] = c; o[4] = a; }

      function rotateAround(px, py, angle) {
        const dx = o[0] - px, dy = o[1] - py, cs = Math.cos(angle), sn = Math.sin(angle);
        o[0] = px + dx * cs - dy * sn;
        o[1] = py + dx * sn + dy * cs;
      }

      // Double "lub-dub" heartbeat used by every heart.
      function beatAt(t) {
        const p = (t % 1.3) / 1.3;
        return 1 + 0.08 * Math.exp(-(((p - 0.1) / 0.05) ** 2)) + 0.05 * Math.exp(-(((p - 0.3) / 0.05) ** 2));
      }

      function heartAt(u) {
        hx = 16 * Math.sin(u) ** 3 / 17;
        hy = (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u) + 2) / 17;
      }

      // A plump heart: dense at the skin, thicker in the middle.
      function puffy(a, b, c, scale, cx, cy, color) {
        heartAt(a * TAU);
        const r = Math.pow(b, 0.35);
        const z = (c * 2 - 1) * 0.45 * Math.sqrt(Math.max(0, 1 - r * r * 0.9));
        put(cx + hx * r * scale, cy + hy * r * scale, z * scale, color + (1 - r) * 0.25, 0.9);
      }

      function nebula(a, b, c, d, t) {
        const r = 0.25 + Math.pow(a, 0.7) * 0.95;
        const th = b * TAU + t * 0.25 / r;
        put(Math.cos(th) * r, (c - 0.5) * 0.3 * (1.3 - r * 0.6) + 0.05 * Math.sin(t + a * 9), Math.sin(th) * r,
          a * 1.1, 0.35 + 0.3 * Math.sin(t * 2 + d * 30));
      }

      function orbitDust(a, b, c, t) {
        const r = 0.95 + a * 0.3;
        const th = b * TAU + t * (0.12 + c * 0.1);
        put(Math.cos(th) * r, (c - 0.5) * 0.3 + 0.06 * Math.sin(t + a * 6), Math.sin(th) * r,
          2, 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2.5 + a * 40)));
      }

      function hug(a, b, c, d, t) {
        if (d < 0.9) {

    const petals = makeSwarm(petalGeometry, petalMaterial, small ? 36 : 64, petalColors, false);

    // Visible half-extents of the view at a given depth.
    const halfHeight = (z) => Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * (CAM_Z - z);

    function scatter(item, anywhere) {
      const h = halfHeight(item.z), w = h * camera.aspect;
      item.x = random(-w, w) * 1.1;
      item.y = anywhere ? random(-h, h) : (item.rising ? -h - 1 : h + 1);
    }

    const dummy = new THREE.Object3D();
    function step(swarm, t, dt, pace) {
      swarm.items.forEach((item, i) => {
        item.y += item.speed * dt * pace;
        item.rx += item.sx * dt * pace;
        item.ry += item.sy * dt * pace;
        item.rz += item.sz * dt * pace;
        const h = halfHeight(item.z) + 1.2;
        if (item.rising ? item.y > h : item.y < -h) scatter(item, false);
        // Petals flutter more than hearts as they fall.
        const flutter = item.rising ? 1 : 1.8;
        dummy.position.set(item.x + Math.sin(t * 0.6 + item.phase) * item.sway * flutter, item.y, item.z);
        dummy.rotation.set(item.rx, item.ry, item.rz);
        dummy.scale.setScalar(item.scale);
        dummy.updateMatrix();
        swarm.mesh.setMatrixAt(i, dummy.matrix);
      });
      swarm.mesh.instanceMatrix.needsUpdate = true;
    }

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    for (const item of hearts.items.concat(petals.items)) scatter(item, true);

    // The camera leans gently towards the pointer.
    const lean = { x: 0, y: 0, tx: 0, ty: 0 };
    window.addEventListener('pointermove', (event) => {
      lean.tx = (event.clientX / window.innerWidth - 0.5) * 1.6;
      lean.ty = (event.clientY / window.innerHeight - 0.5) * -1.0;
    }, { passive: true });

    // When the heart constellation is finished, the whole sky warms up.
    let glow = 0, glowTarget = 0;
    document.addEventListener('sky-complete', () => {
      glowTarget = 1;
      canvas.classList.add('bright');
      if (calm) {
        glow = 1;
        render(0, 0);
      }
    });

    function render(t, dt) {
      glow += (glowTarget - glow) * Math.min(1, dt * 0.8);
      const pace = 1 + glow * 0.8;
      step(hearts, t, dt, pace);
      step(petals, t, dt, pace);
      heartMaterial.emissiveIntensity = 0.3 + glow * 0.45 + 0.05 * Math.sin(t * 2);
      lean.x += (lean.tx - lean.x) * Math.min(1, dt * 2);
      lean.y += (lean.ty - lean.y) * Math.min(1, dt * 2);
      camera.position.set(lean.x, lean.y, CAM_Z);
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      resize();
      if (calm) render(0, 0);
    });

    if (calm) {
      // One still, composed frame for people who prefer less motion.
      render(0, 0);
    } else {
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.05);
        render(clock.elapsedTime, dt);
      });
    }
    canvas.classList.add('ready');

    // ---- Little mice who carry each gift to its star ----
    // An orthographic camera in CSS pixels, so a mouse can run to any point on screen.
    const courierCanvas = document.getElementById('couriers');
    const courierRenderer = new THREE.WebGLRenderer({ canvas: courierCanvas, alpha: true, antialias: true });
    courierRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    courierRenderer.setClearColor(0x000000, 0);
    const stage = new THREE.Scene();
    const view = new THREE.OrthographicCamera(0, 1, 0, -1, -500, 500);
    stage.add(new THREE.HemisphereLight(0xfff3ea, 0x2a0f3a, 1.7));
    const sun = new THREE.DirectionalLight(0xffe6d0, 2.2);
    sun.position.set(-0.5, 1, 1.2);
    stage.add(sun);
    const rim = new THREE.DirectionalLight(0xff9fbf, 1.6);
    rim.position.set(1, 0.3, -1);
    stage.add(rim);

    function sizeStage() {
      courierRenderer.setSize(window.innerWidth, window.innerHeight, false);
      view.right = window.innerWidth;
      view.bottom = -window.innerHeight;
      view.updateProjectionMatrix();
    }
    sizeStage();
    window.addEventListener('resize', sizeStage);

    const ball = new THREE.SphereGeometry(1, 24, 16);
    const cube = new THREE.BoxGeometry(1, 1, 1);
    const bowLoop = new THREE.TorusGeometry(5, 1.8, 8, 20);
    const sparkGeometry = new THREE.OctahedronGeometry(3);
    const shadowGeometry = new THREE.CircleGeometry(1, 24);
    // The tail curls up behind the mouse; beads along it shrink towards the tip.
    const tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(-14, -6, 0), new THREE.Vector3(-28, -2, 0),
      new THREE.Vector3(-36, 12, 0), new THREE.Vector3(-30, 24, 0), new THREE.Vector3(-22, 26, 0)
    ]);
    const whiskerGeometry = new THREE.BufferGeometry().setFromPoints([
      [19, -5, 8], [38, 0, 14], [19, -6, 8], [39, -7, 14], [19, -7, 8], [36, -14, 13],
      [19, -5, -8], [36, 0, -14], [19, -7, -8], [36, -11, -14]
    ].map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    const scarfGeometry = new THREE.TorusGeometry(12, 3.4, 10, 28);

    const fur = new THREE.MeshStandardMaterial({ color: 0xd9ccd6, roughness: 0.8 });
    const cream = new THREE.MeshStandardMaterial({ color: 0xfbf2f5, roughness: 0.85 });
    const pink = new THREE.MeshStandardMaterial({ color: 0xffa9c6, roughness: 0.55 });
    const noseMaterial = new THREE.MeshStandardMaterial({ color: 0xff5d8f, roughness: 0.25 });
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x150b1a, roughness: 0.05, metalness: 0.4 });
    const blush = new THREE.MeshBasicMaterial({ color: 0xff7fa8, transparent: true, opacity: 0.55, depthWrite: false });
    const scarfMaterial = new THREE.MeshStandardMaterial({ color: 0xc2416f, roughness: 0.7 });
    const shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const whiskerMaterial = new THREE.LineBasicMaterial({ color: 0xfbefe6, transparent: true, opacity: 0.6 });
    const shadowMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false });
    const sparkMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const carriedHeart = new THREE.MeshStandardMaterial({ color: 0xff6f9c, emissive: 0xc2416f, emissiveIntensity: 0.4, roughness: 0.3 });
    const wrappings = [[0xc2416f, 0xffd59e], [0x7b2a8a, 0xffd59e], [0xffd59e, 0xc2416f], [0xff6f9c, 0xfff6ea]]
      .map(([paper, ribbon]) => [
        new THREE.MeshStandardMaterial({ color: paper, roughness: 0.45 }),
        new THREE.MeshStandardMaterial({ color: ribbon, roughness: 0.3, metalness: 0.4 })
      ]);
    const sparkColors = ['#ffffff', '#ffd59e', '#ff9fbf', '#ff6f9c'].map((c) => new THREE.Color(c));

    function part(geometry, material, x, y, z, sx, sy, sz) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      return mesh;
    }

    let giftCount = 0;
    function makeGift() {
      const [paper, ribbon] = wrappings[giftCount++ % wrappings.length];
      const gift = new THREE.Group();
      gift.add(part(cube, paper, 0, 0, 0, 24, 20, 24));
      gift.add(part(cube, ribbon, 0, 0, 0, 5, 20.4, 24.4));
      gift.add(part(cube, ribbon, 0, 0, 0, 24.4, 20.4, 5));
      const lid = new THREE.Group();
      lid.position.y = 10;
      lid.add(part(cube, paper, 0, 3, 0, 27, 6, 27));
      lid.add(part(cube, ribbon, 0, 3, 0, 5, 6.4, 27.4));
      lid.add(part(cube, ribbon, 0, 3, 0, 27.4, 6.4, 5));
      for (const side of [-1, 1]) {
        const loop = part(bowLoop, ribbon, side * 5, 10, 0, 1, 1, 1);
        loop.rotation.z = side * 0.6;
        lid.add(loop);
      }
      lid.add(part(ball, ribbon, 0, 7.5, 0, 3, 3, 3));
      gift.add(lid);
      gift.userData.lid = lid;
      return gift;
    }

    // A round, big-headed little mouse in a scarf, feet at the origin, facing +x.
    function makeMouse() {
      const mouse = new THREE.Group();
      mouse.add(part(shadowGeometry, shadowMaterial, 0, 0, -60, 34, 5, 1));
      const pose = new THREE.Group();
      pose.rotation.set(0.15, -0.55, 0);
      mouse.add(pose);
      const body = new THREE.Group();
      pose.add(body);
      const trunk = new THREE.Group();
      trunk.position.y = 4;
      body.add(trunk);
      trunk.add(part(ball, fur, 0, 16, 0, 24, 19, 19));
      trunk.add(part(ball, cream, 13, 19, 0, 11, 12, 15));
      const scarf = part(scarfGeometry, scarfMaterial, 14, 29, 0, 1, 1, 1);
      scarf.rotation.set(Math.PI / 2, 0.35, 0);
      body.add(scarf);
      body.add(part(ball, scarfMaterial, 6, 22, 13, 4, 8, 3));

      const head = new THREE.Group();
      head.position.set(22, 44, 0);
      body.add(head);
      head.add(part(ball, fur, 0, 0, 0, 20, 19, 19));
      head.add(part(ball, cream, 14, -6, 0, 10, 8, 10));
      head.add(part(ball, noseMaterial, 23.5, -4, 0, 4.2, 3.6, 4.2));
      const eyes = [];
      for (const side of [-1, 1]) {
        const eye = new THREE.Group();
        eye.position.set(13, 3, side * 11);
        eye.add(part(ball, eyeMaterial, 0, 0, 0, 4, 5, 3.4));
        eye.add(part(ball, shine, 1.6, 2, side * 2.6, 1.4, 1.4, 1.4));
        eye.add(part(ball, shine, 0.4, -1.8, side * 3, 0.7, 0.7, 0.7));
        head.add(eye);
        eyes.push(eye);
        head.add(part(ball, blush, 11, -5, side * 14.5, 4.5, 2.8, 2));
      }
      head.add(new THREE.LineSegments(whiskerGeometry, whiskerMaterial));
      const ears = [-1, 1].map((side) => {
        const ear = new THREE.Group();
        ear.position.set(-3, 17, side * 12);
        ear.rotation.set(side * 0.35, 0, 0.2);
        ear.add(part(ball, fur, 0, 0, 0, 13, 14, 3.5));
        ear.add(part(ball, pink, 0.8, -0.8, 1.8, 9, 10, 2.2));
        head.add(ear);
        return ear;
      });

      const tail = new THREE.Group();
      tail.position.set(-21, 18, 0);
      for (let i = 0; i <= 48; i += 1) {
        const p = tailCurve.getPoint(i / 48);
        const r = 2.8 - i * 0.04;
        tail.add(part(ball, pink, p.x, p.y, p.z, r, r, r));
      }
      body.add(tail);
      const feet = [[12, 9], [12, -9], [-12, 9], [-12, -9]].map(([x, z]) => {
        const foot = part(ball, pink, x, 3, z, 6.5, 3.5, 5.5);
        pose.add(foot);
        return foot;
      });
      mouse.userData = { pose, body, trunk, head, eyes, ears, tail, feet, stride: 0, wink: random(0, 3) };
      return mouse;
    }

    // Legs, bounce, squash, tail and ears for a mouse that moved `dx` pixels this frame.
    function scurry(mouse, dx, t) {
      const parts = mouse.userData;
      parts.stride += Math.abs(dx) * 0.11;
      const s = parts.stride;
      parts.feet.forEach((foot, i) => {
        const phase = s + (i < 2 ? 0 : Math.PI) + (i % 2) * 0.6;
        foot.position.x = (i < 2 ? 12 : -12) + Math.sin(phase) * 5;
        foot.position.y = 3 + Math.max(0, Math.cos(phase)) * 3;
      });
      const bounce = Math.abs(Math.sin(s));
      parts.body.position.y = bounce * 3.5;
      parts.trunk.scale.set(1 + 0.05 * (1 - bounce), 1 - 0.05 * (1 - bounce), 1);
      parts.head.rotation.z = Math.sin(s * 2) * 0.05;
      parts.tail.rotation.z = Math.sin(t * 9) * 0.25;
      parts.ears.forEach((ear, i) => { ear.rotation.z = 0.2 + Math.sin(t * 7 + i) * 0.12; });
    }

    // Every few seconds the mouse blinks.
    function blink(mouse, t) {
      const open = (t + mouse.userData.wink) % 3.2 < 0.12 ? 0.12 : 1;
      mouse.userData.eyes.forEach((eye) => { eye.scale.y = open; });
    }

    const couriers = [];
    const sparks = [];
    const lids = [];
    let lastTick = performance.now();

    function burst(x, y) {
      const count = 32;
      const mesh = new THREE.InstancedMesh(sparkGeometry, sparkMaterial, count);
      const motes = Array.from({ length: count }, (_, i) => {
        mesh.setColorAt(i, sparkColors[i % sparkColors.length]);
        const angle = random(0, Math.PI * 2), speed = random(120, 340);
        return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed + 80, spin: random(-8, 8), size: random(0.7, 1.6) };
      });
      stage.add(mesh);
      sparks.push({ mesh, motes, age: 0 });
    }

    const ease = (p) => 1 - (1 - p) ** 3;

    function updateCourier(c, dt, t) {
      const { mouse } = c;
      const parts = mouse.userData;
      c.time += dt;
      const startX = mouse.position.x;
      blink(mouse, t);

      if (c.state === 'run') {
        const p = Math.min(1, c.time / c.duration);
        mouse.position.x = c.from + (c.to - c.from) * ease(p);
        scurry(mouse, mouse.position.x - startX, t);
        if (p === 1) {
          c.state = 'toss';
          c.time = 0;
          stage.attach(c.gift);
          c.giftFrom = c.gift.position.clone();
        }
      } else if (c.state === 'toss') {
        // The mouse rears up and flings the present up to its star.
        const p = Math.min(1, c.time / 0.5);
        const e = ease(p);
        c.gift.position.set(
          c.giftFrom.x + (c.target.x - c.giftFrom.x) * e,
          c.giftFrom.y + (c.target.y - c.giftFrom.y) * e + Math.sin(Math.PI * p) * 60,
          40
        );
        c.gift.rotation.z = -c.facing * p * Math.PI * 2;
        parts.pose.rotation.z = 0.3 * Math.sin(Math.PI * p);
        if (p === 1) {
          const lid = c.gift.userData.lid;
          stage.attach(lid);
          lids.push({ lid, vx: c.facing * random(40, 120), vy: random(240, 320), spin: random(-9, 9), age: 0 });
          burst(c.target.x, c.target.y);
          c.state = 'cheer';
          c.time = 0;
          c.resolve();
        }
      } else if (c.state === 'cheer') {
        // A happy ear wiggle while the empty box shrinks away.
        const p = Math.min(1, c.time / 0.8);
        const k = Math.max(0, 1 - c.time / 0.3) * c.size;
        c.gift.scale.set(c.facing * k, k, k);
        parts.ears.forEach((ear, i) => { ear.rotation.z = 0.2 + Math.sin(t * 18 + i) * 0.3; });
        parts.tail.rotation.z = Math.sin(t * 14) * 0.45;
        if (p === 1) {
          stage.remove(c.gift);
          mouse.position.y = -c.ground;
          c.state = 'turn';
          c.time = 0;
        }
      } else if (c.state === 'turn') {
        const p = Math.min(1, c.time / 0.2);
        mouse.scale.x = c.facing * c.size * (1 - 2 * p);
        if (p === 1) {
          c.state = 'leave';
          c.time = 0;
        }
      } else {
        // 'leave' heads home; 'parade' trots across with a heart.
        const direction = c.state === 'leave' ? -c.facing : c.facing;
        const speed = c.state === 'leave' ? 200 + 900 * c.time : 230;
        mouse.position.x += direction * speed * dt;
        scurry(mouse, mouse.position.x - startX, t);
        if (c.heart) c.heart.rotation.y += dt * 2.5;
        if (mouse.position.x < -160 || mouse.position.x > window.innerWidth + 160) {
          stage.remove(mouse);
          return false;
        }
      }
      return true;
    }

    function tick(now) {
      const dt = Math.min((now - lastTick) / 1000, 0.05);
      lastTick = now;
      const t = now / 1000;
      for (let i = couriers.length - 1; i >= 0; i -= 1) {
        if (!updateCourier(couriers[i], dt, t)) couriers.splice(i, 1);
      }
      for (let i = lids.length - 1; i >= 0; i -= 1) {
        const l = lids[i];
        l.age += dt;
        l.vy -= 900 * dt;
        l.lid.position.x += l.vx * dt;
        l.lid.position.y += l.vy * dt;
        l.lid.rotation.z += l.spin * dt;
        const k = Math.max(0, 1 - Math.max(0, l.age - 0.4) / 0.4);
        l.lid.scale.setScalar(k);
        if (l.age > 0.8) {
          stage.remove(l.lid);
          lids.splice(i, 1);
        }
      }
      for (let i = sparks.length - 1; i >= 0; i -= 1) {
        const s = sparks[i];
        s.age += dt;
        const fade = Math.max(0, 1 - s.age / 1.1);
        s.motes.forEach((m, j) => {
          m.vy -= 300 * dt;
          m.vx *= 0.98;
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          dummy.position.set(m.x, m.y, 60);
          dummy.rotation.set(0, 0, s.age * m.spin);
          dummy.scale.setScalar(m.size * fade);
          dummy.updateMatrix();
          s.mesh.setMatrixAt(j, dummy.matrix);
        });
        s.mesh.instanceMatrix.needsUpdate = true;
        if (fade === 0) {
          stage.remove(s.mesh);
          s.mesh.dispose();
          sparks.splice(i, 1);
        }
      }
      courierRenderer.render(stage, view);
      // Sleep while nobody is running around.
      if (!couriers.length && !lids.length && !sparks.length) courierRenderer.setAnimationLoop(null);
    }

    function wake() {
      lastTick = performance.now();
      courierRenderer.setAnimationLoop(tick);
    }

    // Called by the star script; resolves the moment the gift pops open.
    window.deliverGift = (x, y) => new Promise((resolve) => {
      const size = small ? 0.95 : 1.15;
      const facing = x < window.innerWidth / 2 ? 1 : -1;
      // Stop below and beside the star so the mouse never hides it.
      const ground = y + 86 * size;
      const from = facing > 0 ? -120 : window.innerWidth + 120;
      const to = x - facing * 86 * size;
      const mouse = makeMouse();
      mouse.position.set(from, -ground, 0);
      mouse.scale.set(facing * size, size, size);
      // The present rides on its back, inside the 3D pose so it turns with the mouse.
      const gift = makeGift();
      gift.position.set(-8, 52, 0);
      mouse.userData.body.add(gift);
      stage.add(mouse);
      couriers.push({
        mouse, gift, facing, size, ground, from, to, resolve,
        target: new THREE.Vector3(x, -y, 40),
        duration: Math.min(1.5, Math.max(0.7, Math.abs(to - from) / 600)),
        state: 'run', time: 0
      });
      wake();
    });

    // At the finale a little parade of mice carries hearts along the bottom of the sky.
    function parade() {
      if (document.visibilityState !== 'visible') return;
      const size = small ? 0.8 : 1;
      for (let i = 0; i < 3; i += 1) {
        const mouse = makeMouse();
        mouse.position.set(-110 - i * 95 * size, -(window.innerHeight - 18), 0);
        mouse.scale.set(size, size, size);
        const heart = new THREE.Mesh(heartGeometry, carriedHeart);
        heart.position.set(-6, 66, 30);
        heart.scale.setScalar(20);
        mouse.add(heart);
        stage.add(mouse);
        couriers.push({ mouse, heart, facing: 1, size, state: 'parade', time: 0 });
      }
      wake();
    }
    if (!calm) {
      document.addEventListener('sky-complete', () => {
        courierCanvas.classList.add('behind');
        window.setTimeout(parade, 3200);
        window.setInterval(parade, 16000);
      });
    }
  </script>
</body>
</html>
